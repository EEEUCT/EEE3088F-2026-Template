name: GitHub Classroom Autograding

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
    inputs:
      solution_mode:
        description: 'Inject Instructor Solution?'
        required: true
        default: false
        type: boolean

env:
  # Suppress Node.js 20 deprecation warnings by opting into Node 24 early
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  grade:
    name: Firmware Autograder
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3 python3-numpy

      # -----------------------------------------------------------------------
      # [ADMIN] SOLUTION INJECTION
      # -----------------------------------------------------------------------
      - name: "[Admin] Inject Instructor Solution"
        if: ${{ inputs.solution_mode == true }}
        run: |
          echo "${{ secrets.DOA_SOLUTION_BASE64 }}" | base64 -d > firmware/src/doa_engine.c
          echo "::notice::Instructor Solution Injected. Expecting 100% pass."

      # -----------------------------------------------------------------------
      # PHASE 1: I2C & REGISTER MAP AUDIT
      # -----------------------------------------------------------------------
      
      - name: "[I2C] Static Contract Verification"
        run: python3 firmware/tests/verify_registers.py
        
      - name: "[I2C] State Machine Logic Check"
        run: |
          gcc -std=c11 \
            firmware/src/i2c_slave.c \
            firmware/src/doa_engine.c \
            firmware/tests/test_i2c_logic.c \
            -I firmware/include \
            -o i2c_audit -lm
          ./i2c_audit

      # -----------------------------------------------------------------------
      # PHASE 2: DoA ENGINE STRESS TEST (Hidden)
      # -----------------------------------------------------------------------

      - name: "[DoA] Generate Secret Test Vectors"
        # The --randomize flag creates the secret BORE/END/NOISE macros in public_vectors.h
        run: python3 firmware/tests/data/scripts/public_vectors.py --randomize

      - name: "[DoA] Compile and Run Engine Tests"
        run: |
          gcc -std=c11 \
            firmware/src/doa_engine.c \
            firmware/tests/test_doa.c \
            firmware/tests/data/public_vectors.c \
            -I firmware/include \
            -I firmware/tests/data \
            -o test_doa -lm
          
          # Run the test, capture output to file, but ensure we still see it in the console (tee)
          # We use pipefail so that if ./test_doa fails, the step still registers as failure.
          set -o pipefail
          ./test_doa | tee grading_log.txt

      # -----------------------------------------------------------------------
      # SCORING
      # -----------------------------------------------------------------------
      # If any step above fails (exit code != 0), the workflow marks the commit as Failed (Red X).

      - name: "[Admin] Publish Score"
        if: always() # Run this even if the tests failed
        run: |
          # Create a fallback if the log doesn't exist (e.g. compilation failed)
          touch grading_log.txt
          
          # Extract the mark line or default to 0/0
          SCORE_LINE=$(grep "TOTAL MARKS" grading_log.txt || echo "TOTAL MARKS : 0 / 0")
          
          # 1. Save to artifact file (for bulk download later)
          echo "$SCORE_LINE" > score.txt
          
          # 2. Post to the GitHub Actions Summary Page (Visible immediately in UI)
          echo "### 🎓 Grading Result" >> $GITHUB_STEP_SUMMARY
          echo "**$SCORE_LINE**" >> $GITHUB_STEP_SUMMARY
          
          # Debug print to console
          echo "Extracted: $SCORE_LINE"

      - name: Upload Score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autograding-score
          path: score.txt